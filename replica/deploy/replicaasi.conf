# https://replicaasi.com - REPLICA at the root of its own domain. App on /run/replica/app.sock, static files /opt/replica/static.
# Zones rp_api / rp_page from conf.d/replica-zones.conf. Installed by deploy/domain.sh once the certificate exists.
server {
    listen 80; listen [::]:80;
    server_name replicaasi.com www.replicaasi.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://replicaasi.com$request_uri; }
}

server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name replicaasi.com www.replicaasi.com;
    ssl_certificate /etc/letsencrypt/live/replicaasi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/replicaasi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3; ssl_prefer_server_ciphers off;
    if ($host = www.replicaasi.com) { return 301 https://replicaasi.com$request_uri; }

    client_max_body_size 8k; client_body_timeout 10s; client_header_timeout 10s;
    server_tokens off; limit_req_status 429;
    gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; media-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    root /opt/replica/static;
    location = / { limit_req zone=rp_page burst=20 nodelay; try_files /index.html =404; add_header Cache-Control "no-cache" always;
      add_header Strict-Transport-Security "max-age=31536000" always; add_header X-Content-Type-Options nosniff always;
      add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; media-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always; }
    location ~ ^/(page\.js|ca\.js|rea\.js|skills\.js|runner\.js|face\.js|bench\.js|wallets\.js|paper\.css|replica\.js|web3\.iife\.min\.js)$ { limit_req zone=rp_page burst=20 nodelay; limit_except GET { deny all; } try_files $uri =404; }
    location ~ "^/(api/(config|health|registry|network|events|rooms|discoveries|skills/[0-9a-f]{64}|host/[1-9A-HJ-NP-Za-km-z]{32,44}|replica/[1-9A-HJ-NP-Za-km-z]{32,44}(/(log|skills))?)|meta/[1-9A-HJ-NP-Za-km-z]{32,44}\.(json|svg))$" {
        limit_req zone=rp_page burst=20 nodelay; limit_except GET { deny all; }
        proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Host $host;
        proxy_pass http://unix:/run/replica/app.sock; proxy_read_timeout 20s;
    }
    location = /api/append { limit_req zone=rp_api burst=5 nodelay; limit_except POST { deny all; } client_max_body_size 48k; proxy_pass http://unix:/run/replica/app.sock; proxy_read_timeout 30s; }
    location = /api/skills { limit_req zone=rp_api burst=5 nodelay; limit_except POST { deny all; } client_max_body_size 4m; proxy_pass http://unix:/run/replica/app.sock; proxy_read_timeout 30s; }
    location ~ ^/api/rea/(start|list|get|cancel)$ { limit_req zone=rp_api burst=5 nodelay; limit_except POST { deny all; } client_max_body_size 2m; proxy_pass http://unix:/run/replica/app.sock; proxy_read_timeout 30s; }
    location ~ ^/samples/search/(index\.html|search\.js|child\.js|demo\.js|fixtures\.json|parent\.skill\.json|child\.skill\.json|preview\.png)?$ { limit_req zone=rp_page burst=20 nodelay; limit_except GET { deny all; } try_files $uri $uri/index.html =404; }
    location = /samples/search { return 301 /samples/search/; }
    location ~ ^/api/(nonce|verify|mine|eligible|claim|delegate|invite|invite/info|compute|rpc)$ {
        limit_req zone=rp_api burst=5 nodelay; limit_except POST { deny all; }
        proxy_pass http://unix:/run/replica/app.sock; proxy_read_timeout 60s;
    }
    location ~ ^/api/runner/(offer|pair|list|get|enqueue|cancel|revoke|poll|heartbeat|fail|complete)$ {
        limit_req zone=rp_api burst=5 nodelay; limit_except POST { deny all; }
        client_max_body_size 4m; proxy_pass http://unix:/run/replica/app.sock; proxy_read_timeout 30s;
    }
    location ~ ^/runner/(index\.html|replica-runner\.zip|guide\.txt)?$ { limit_req zone=rp_page burst=20 nodelay; limit_except GET { deny all; } try_files $uri $uri/index.html =404; }
    location = /runner { return 301 /runner/; }
    # the video + the article
    location ~ ^/(film/replica\.mp4|news/(index\.html|header\.jpg)?)$ { limit_req zone=rp_page burst=20 nodelay; try_files $uri $uri/index.html =404; }
    location = /news { return 301 /news/; }
    location = /favicon.ico { access_log off; return 204; }
    location / { return 404; }
}
